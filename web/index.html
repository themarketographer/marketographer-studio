<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio Marketographer</title>
  <link rel="stylesheet" href="/shell.css">
  <script>try{var e=parseFloat(localStorage.getItem("estudio.escala"));document.documentElement.style.setProperty("--esc",e>=0.7&&e<=1.3?e:0.9)}catch(x){}</script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="app">
    <nav class="side" aria-label="Módulos">
      <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span>Estudio</span></div>
      <ul id="nav"></ul>
      <div class="escala" role="group" aria-label="Tamaño de la interfaz">
        <button type="button" id="esc-menos" aria-label="Hacer la interfaz más pequeña" title="Más pequeño">A-</button>
        <output id="esc-val" aria-live="polite">90%</output>
        <button type="button" id="esc-mas" aria-label="Hacer la interfaz más grande" title="Más grande">A+</button>
        <button type="button" id="esc-reset" aria-label="Volver al tamaño normal" title="Tamaño normal">Reset</button>
      </div>
      <button type="button" id="resp-btn" class="resp-btn" title="Copias de tus guiones, temas y clases">Copias de seguridad</button>
      <p class="side-foot">Cada herramienta es un módulo. Los nuevos aparecen aquí solos.</p>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/shell.js"></script>
</body>
</html>
